name: airflow-data-orchestration

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true

x-airflow-common: &airflow-common
  build: .
  image: local/airflow-data-orchestration:2.10.5
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run make env first}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?run make env first}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_HTTP_PORT: "8123"
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dbt}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dbt}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./tests:/opt/airflow/tests:ro
    - airflow-logs:/opt/airflow/logs
  <<: *common-security

services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *common-security

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.8}
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dbt}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dbt}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HOST_PORT:-18125}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *common-security

  airflow-init:
    <<: *airflow-common
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      <<: *airflow-env
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run make env first}
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && (airflow users create --role Admin --username admin --firstname Admin
        --lastname User --email admin@localhost --password "$${_AIRFLOW_WWW_USER_PASSWORD}" || true)

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_WEB_PORT:-18080}:8080"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8974/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  airflow-db:
  airflow-logs:
  clickhouse-data:
